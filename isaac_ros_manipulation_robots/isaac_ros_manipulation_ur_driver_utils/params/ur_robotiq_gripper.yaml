robot_type: UR
ur_type: ur10e
gripper_type: robotiq_2f_140
use_sim_time: 'true'
setup: sim_test_bench
robot_ip: 192.56.1.2 # not used for sim
log_level: error

# Robot driver launch file
robot_launch_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_ur_driver_utils)/launch/drivers/ur_robotiq_driver.launch.py

# Robot description params
urdf_path: $(ros2 pkg prefix --share isaac_ros_manipulation_ur_robot_description)/urdf/ur_robotiq_gripper.urdf.xacro
srdf_path: $(ros2 pkg prefix --share isaac_ros_manipulation_ur_robot_description)/srdf/ur_robotiq_2f_140_gripper.srdf.xacro
joint_limits_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_ur_robot_description)/config/joint_limits.yaml
kinematics_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_ur_robot_description)/config/kinematics_sim.yaml
moveit_controllers_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_ur_robot_description)/config/moveit_sim_controllers.yaml
ros2_controllers_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_ur_robot_description)/config/ros2_control_controllers_sim.yaml
controller_spawner_timeout: 10
tf_prefix: ''
runtime_config_package: 'ur_robot_driver'
initial_joint_controller: 'scaled_joint_trajectory_controller'
ur_calibration_file_path: ''

# Visualization
rviz_config_file: $(ros2 pkg prefix --share isaac_ros_manipulation_bringup)/config/visualization/sim_workflows.rviz
use_pose_from_rviz: 'false'

# Visualization
enable_rviz_visualization: 'true'
enable_foxglove_visualization: 'false'
