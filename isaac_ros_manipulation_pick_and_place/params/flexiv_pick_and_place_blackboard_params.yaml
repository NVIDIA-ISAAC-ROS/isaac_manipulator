# Blackboard Parameters for Flexiv Rizon Pick and Place
blackboard_params:
  max_num_next_object: 2
  use_drop_pose_from_rviz: false
  abort_motion: false

  # [x, y, z, qx, qy, qz, qw]
  home_pose: [0.0, 0.3, 0.5, 0.0, 1.0, 0.0, 0.0]

  mode: 0
  target_poses: []
  class_ids: []

  selected_object_id: null
  active_obj_id: null
  goal_drop_pose: null
  rviz_drop_pose: null
  object_info_cache: null
  next_object_id: []

  workflow_status: 4
  workflow_summary: ""

  supported_objects:
    soup_can:
      class_id: '3'
      grasp_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/config/grav_grasps_soup_can.yaml
      mesh_file_path: ${ISAAC_ROS_WS}/isaac_ros_assets/isaac_ros_foundationpose/soup_can/soup_can.obj
