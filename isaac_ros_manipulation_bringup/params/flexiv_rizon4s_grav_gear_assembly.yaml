camera_type: REALSENSE
num_cameras: 1
workflow_type: GEAR_ASSEMBLY
robot_type: FLEXIV

rizon_type: Rizon4s
gripper_type: grav
use_sim_time: 'false'
headless: 'false'
setup: flexiv_test_bench  # change this later
robot_ip: 192.56.1.2 # not used for flexiv
log_level: error

# Flexiv-specific params
robot_sn: 'Rizon4s-062840'
use_fake_hardware: 'false'
load_gripper: 'true'
start_rviz: 'true'
rdk_control_mode: joint_impedance

# Robot driver launch file (real robot, uses flexiv_bringup + cuMotion)
robot_launch_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_driver_utils)/launch/flexiv_rizon_real_driver.launch.py

# Path to MoveIt .scene file with static collision objects to preload
moveit_collision_objects_scene_file: $(ros2 pkg prefix --share isaac_ros_manipulation_bringup)/config/scene_objects/flexiv_test_bench/flexiv_test_scene_objects.scene

# Robot description params (not used by flexiv_rizon_real_driver.launch.py, which
# gets URDF/SRDF/kinematics/controllers directly from flexiv_description and
# flexiv_moveit_config third-party packages, but kept for workflow compatibility)
urdf_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/urdf/rizon_grav.urdf.xacro
srdf_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/srdf/rizon_grav.srdf.xacro
joint_limits_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/config/joint_limits.yaml
kinematics_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/config/kinematics_sim.yaml
moveit_controllers_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/config/moveit_sim_controllers.yaml
ros2_controllers_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/config/ros2_control_controllers_sim.yaml
controller_spawner_timeout: 10
tf_prefix: ''
initial_joint_controller: 'rizon_arm_controller'
ur_calibration_file_path: ''

# cuMotion-specific params (paths point to prefixed copies generated at launch
# by flexiv_rizon_real_driver.launch.py; originals live in
# isaac_ros_cumotion_robot_description with unprefixed joint/link names)
cumotion_urdf_file_path: /tmp/flexiv_rizon4s_grav_prefixed.urdf
cumotion_xrdf_file_path: /tmp/flexiv_rizon4s_grav_prefixed.xrdf
cumotion_joint_states_topic: /joint_states
distance_threshold: 0.05
enable_nvblox: 'false'
nvblox_global_frame: 'world'

# Visualization
rviz_config_file: $(ros2 pkg prefix --share isaac_ros_manipulation_bringup)/config/visualization/pick_and_place.rviz
use_pose_from_rviz: 'false'

# Time sync params
time_sync_slop: 0.1

# Perception
depth_type: REALSENSE
enable_dnn_depth_in_realsense: 'false'
object_detection_type: SEGMENT_ANYTHING
selection_policy: HIGHEST_SCORE
segmentation_type: SEGMENT_ANYTHING
segment_anything_input_points_topic: input_points
segment_anything_input_detections_topic: input_detections
segment_anything_enable_debug_output: 'false'
sam_model_repository_paths: ['$ISAAC_ROS_WS/isaac_ros_assets/models/triton']
ess_full_engine_file_path: $ISAAC_ROS_WS/isaac_ros_assets/models/dnn_stereo_disparity/dnn_stereo_disparity_v4.1.0_onnx_trt10.16/ess.engine
ess_light_engine_file_path: $ISAAC_ROS_WS/isaac_ros_assets/models/dnn_stereo_disparity/dnn_stereo_disparity_v4.1.0_onnx_trt10.16/light_ess.engine
foundationstereo_low_res_engine_file_path: $ISAAC_ROS_WS/isaac_ros_assets/models/foundationstereo/deployable_v2.0/foundationstereo_320x736.engine
foundationstereo_high_res_engine_file_path: $ISAAC_ROS_WS/isaac_ros_assets/models/foundationstereo/deployable_v2.0/foundationstereo_576x960.engine
pose_estimation_type: FOUNDATION_POSE
pose_estimation_input_qos: 'SENSOR_DATA'
pose_estimation_input_fps: '15'
pose_estimation_dropped_fps: '10'
dope_engine_file_path: $ISAAC_ROS_WS/isaac_ros_assets/models/dope/soup_can.engine
dope_model_file_path: $ISAAC_ROS_WS/isaac_ros_assets/models/dope/soup_can.onnx

foundation_pose_mesh_file_path: $ISAAC_ROS_WS/isaac_ros_assets/isaac_ros_foundationpose/soup_can/soup_can.obj
foundation_pose_refine_engine_file_path: $ISAAC_ROS_WS/isaac_ros_assets/models/foundationpose/refine_trt_engine.plan
foundation_pose_texture_path: $ISAAC_ROS_WS/isaac_ros_assets/isaac_ros_foundationpose/soup_can/baked_mesh_tex0.png
foundation_pose_score_engine_file_path: $ISAAC_ROS_WS/isaac_ros_assets/models/foundationpose/score_trt_engine.plan

grounding_dino_engine_file_path: $ISAAC_ROS_WS/isaac_ros_assets/models/grounding_dino/grounding_dino_model.plan
grounding_dino_model_file_path: $ISAAC_ROS_WS/isaac_ros_assets/models/grounding_dino/grounding_dino_model.onnx
grounding_dino_default_prompt: 'soup can.'
grounding_dino_confidence_threshold: '0.6'
grounding_dino_network_image_width: '960'
grounding_dino_network_image_height: '544'

rtdetr_engine_file_path: $ISAAC_ROS_WS/isaac_ros_assets/models/synthetica_detr/sdetr_grasp.plan
object_class_id: '3'
rt_detr_confidence_threshold: '0.5'

# Pick and place params
use_ground_truth_pose_in_sim: 'false'
pick_and_place_planner_retries: 5
pick_and_place_retry_wait_time: 5.0
sim_gt_asset_frame_id: 'soup_can'
grasps_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/config/grav_grasps_large_gear.yaml
time_dilation_factor: '0.6'

# For pick and place automated testing
move_to_home_pose_after_place: 'false'
home_pose: [-0.25, 0.2, 0.4, 0.034, 0.996, 0.066, 0.042]

# Object Attachment params
object_attachment_type: CUSTOM_MESH
object_attachment_scale: [0.09, 0.185, 0.035]
attach_object_mesh_file_path: $ISAAC_ROS_WS/isaac_ros_assets/isaac_ros_manipulation_dnn_policy/gear_large/gear_large.obj
end_effector_mesh_resource_uri: ''  # No grav gripper mesh available yet; falls back to cube marker

# Visualization
enable_rviz_visualization: 'true'
enable_foxglove_visualization: 'false'

# Behavior tree params
behavior_tree_config_file: ${ISAAC_ROS_MANIPULATION_PICK_AND_PLACE_CONFIG_DIR}/flexiv_pick_and_place_behavior_tree_params.yaml
blackboard_config_file: ${ISAAC_ROS_MANIPULATION_PICK_AND_PLACE_CONFIG_DIR}/flexiv_pick_and_place_blackboard_params.yaml
print_ascii_tree: 'false'
manual_mode: 'false'

# Nsight Profiling
delay_to_start_nsight: '5'
nsight_profile_duration: '20'
nsight_profile_output_file_path: $ISAAC_ROS_WS/nsight_profile.nsys
enable_nsight_profiling: 'false'
enable_system_wide_profiling: 'false'

# MPS parameters
enable_cuda_mps: 'false'
cuda_mps_pipe_directory: $ISAAC_ROS_WS/mps_pipe_dir
cuda_mps_active_thread_percentage_container: '100'
cuda_mps_client_priority_container: '1'
cuda_mps_client_priority_robot_segmenter: '1'
cuda_mps_active_thread_percentage_robot_segmenter: '100'
cuda_mps_client_priority_planner: '0'
cuda_mps_active_thread_percentage_planner: '100'

# Gear assembly parameters
gear_assembly_model_path: $ISAAC_ROS_WS/isaac_ros_assets/isaac_ros_manipulation_dnn_policy/flexiv/
gear_assembly_model_file_name: rizon4s_grav.pt
gear_assembly_policy_alpha: 1.0
gear_assembly_observation_topic: /gear_assembly/observation
gear_assembly_joint_state_topic: /flexiv_arm/joint_states
gear_assembly_target_joint_state_topic: /isaac_joint_commands
gear_assembly_target_tcp_state_topic: /gear_assembly/target_tcp_state
gear_assembly_gear_insertion_request_topic: /gear_assembly/gear_insertion_request
gear_assembly_goal_pose_topic: /gear_assembly/goal_pose
gear_assembly_gear_insertion_status_topic: /gear_assembly/gear_insertion_status
gear_assembly_ros_bag_folder_path: $ISAAC_ROS_WS/rl_inference_policy
gear_assembly_enable_recording: 'false'
gear_assembly_use_joint_state_planner: 'true'
gear_assembly_peg_stand_mesh_file_path: $ISAAC_ROS_WS/isaac_ros_assets/isaac_ros_manipulation_dnn_policy/gear_base/gear_base.obj
gear_assembly_gear_large_mesh_file_path: $ISAAC_ROS_WS/isaac_ros_assets/isaac_ros_manipulation_dnn_policy/gear_large/gear_large.obj
gear_assembly_gear_small_mesh_file_path: $ISAAC_ROS_WS/isaac_ros_assets/isaac_ros_manipulation_dnn_policy/gear_small/gear_small.obj
gear_assembly_gear_medium_mesh_file_path: $ISAAC_ROS_WS/isaac_ros_assets/isaac_ros_manipulation_dnn_policy/gear_medium/gear_medium.obj
gear_assembly_use_ground_truth_pose_in_sim: 'false'
gear_assembly_verify_pose_estimation_accuracy: 'false'
gear_assembly_run_rl_inference: 'true'
gear_assembly_output_dir: $ISAAC_ROS_WS/gear_assembly_outputs
gear_assembly_offset_for_place_pose: 0.27
gear_assembly_offset_for_insertion_pose: 0.0
gear_assembly_place_pose_z_rotation_deg: 90.0
gear_assembly_post_insertion_gripper_rotation_deg: 90.0
gear_assembly_timeout_for_insertion_action_call: 7.0
gear_assembly_model_frequency: 60.0
