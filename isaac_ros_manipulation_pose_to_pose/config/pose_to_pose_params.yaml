# Pose-to-pose workflow parameters
# These configure the pose_to_pose_node which plans and executes motions
# between target frames using cuMotion directly.
pose_to_pose_node:
  ros__parameters:
    # The world/base frame of the robot
    world_frame: 'base_link'

    # List of target frames to cycle through
    target_frames: ['target1_frame', 'target2_frame']

    # Planning loop period in seconds
    plan_timer_period: 0.5

    # Reference frame for the goal pose (typically the robot base frame)
    link_name: 'base_link'

    # cuMotion MotionPlan action server name
    motion_plan_action_server_name: 'cumotion/motion_plan'

    # MoveIt ExecuteTrajectory action server name
    execute_trajectory_action_server_name: 'execute_trajectory'

    # Whether to request ESDF update from nvblox before planning
    update_esdf: true

    # Time dilation factor passed to the cuMotion planner to control trajectory execution speed
    time_dilation_factor: 0.6
